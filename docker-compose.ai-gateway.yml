# Independent local trial; does not modify the application/database stack.
services:
  ai-gateway:
    image: ghcr.io/berriai/litellm:v1.108.1
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env or the shell}
      LITELLM_MASTER_KEY: ${AI_GATEWAY_API_KEY:-sk-testportal-local-only}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?Set a persistent LITELLM_SALT_KEY in .env}
      DATABASE_URL: postgresql://litellm:${LITELLM_DB_PASSWORD:?Set LITELLM_DB_PASSWORD in .env}@ai-gateway-db:5432/litellm
      STORE_MODEL_IN_DB: "True"
    depends_on:
      ai-gateway-db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/readiness')"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    volumes:
      - ./local/ai-gateway/config.yaml:/app/config.yaml:ro
    command:
      ["--config", "/app/config.yaml", "--port", "4000", "--host", "0.0.0.0"]

  ai-gateway-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: litellm
      POSTGRES_DB: litellm
      POSTGRES_PASSWORD: ${LITELLM_DB_PASSWORD:?Set LITELLM_DB_PASSWORD in .env}
    volumes:
      - ai-gateway-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  ai-gateway-postgres:
